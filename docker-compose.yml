services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-capstone}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Imports the schema automatically on first startup.
      - ./capstone.sql:/docker-entrypoint-initdb.d/01-capstone.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-capstone}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENABLE_LIVE_SCRAPING: "false"
      PORT: "5000"
    ports:
      - "5000:5000"

volumes:
  db_data:
