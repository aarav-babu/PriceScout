services:
  - type: web
    name: pricescout
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: pip install -r requirements-public.txt && python -m unittest discover -s tests -p 'test_public*.py' -v
    startCommand: gunicorn public_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
