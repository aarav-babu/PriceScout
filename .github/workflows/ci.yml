name: PriceScout CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and production startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-public.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-public.txt
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Check production startup
        env:
          RENDER: 'true'
          SECRET_KEY: ci-only-not-a-production-secret
          RENDER_GIT_COMMIT: ${{ github.sha }}
        run: |
          gunicorn public_app:app --bind 127.0.0.1:8000 --workers 1 --threads 4 > /tmp/gunicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /tmp/health.json; then
              python -c 'import json, os; d=json.load(open("/tmp/health.json")); assert d["status"] == "ok"; assert d["revision"] == os.environ["RENDER_GIT_COMMIT"]'
              curl --fail --silent http://127.0.0.1:8000/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gunicorn.log
          exit 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  deploy:
    name: Deploy and verify production
    needs: [test, secrets]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pricescout-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Deploy the tested commit and verify health
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_render.py
