name: PriceScout CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and production startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-public.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-public.txt
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Check production startup
        env:
          RENDER: 'true'
          SECRET_KEY: ci-only-not-a-production-secret
          RENDER_GIT_COMMIT: ${{ github.sha }}
        run: |
          gunicorn public_app:app --bind 127.0.0.1:8000 --workers 1 --threads 4 > /tmp/gunicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /tmp/health.json; then
              python -c 'import json, os; d=json.load(open("/tmp/health.json")); assert d["status"] == "ok"; assert d["revision"] == os.environ["RENDER_GIT_COMMIT"]'
              curl --fail --silent http://127.0.0.1:8000/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gunicorn.log
          exit 1
