<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | PriceScout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/misc/contact.css') }}">
</head>

<body>
    {% if user_is_signed_in %}
    {% include '/navigbar/navbar.html' %}
    {% else %}
    {% include '/navigbar/nosessionbar.html' %}
    {% endif %}

    <div class="contact-page">
        <div class="contact-panel">
            <span class="eyebrow">Contact</span>
            <h1>Get in touch</h1>
            <p>Questions about a valuation or the product? Reach out directly &mdash; I'm happy to help.</p>
        </div>

        <div class="contact-methods">
            <a class="contact-card" href="mailto:ababu009@ucr.edu">
                <span class="contact-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                        <path d="m22 7-10 6L2 7" />
                    </svg>
                </span>
                <span class="contact-text">
                    <span class="contact-label">Email</span>
                    <span class="contact-value">ababu009@ucr.edu</span>
                </span>
            </a>

            <a class="contact-card" href="tel:+19517426491">
                <span class="contact-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z" />
                    </svg>
                </span>
                <span class="contact-text">
                    <span class="contact-label">Phone</span>
                    <span class="contact-value">+1 951-742-6491</span>
                </span>
            </a>
        </div>
    </div>
</body>

</html>
