<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value your car | PriceScout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/postdata.css') }}">
</head>

<body>
    {% include '/navigbar/navbar.html' %}
    <div class="form-page">
        <div class="wizard">
            <div class="wizard-head">
                <span class="eyebrow">Instant valuation</span>
                <h1>Value your car</h1>
                <ol class="stepper" aria-hidden="true"></ol>
                <div class="wizard-progress"><span></span></div>
            </div>

            <form method="post" onsubmit="localStorage.setItem('vehicleform', 'true');">
                <fieldset class="form-section">
                    <legend>Vehicle</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="vehicle-type">Vehicle type</label>
                            <select name="vehicle-type" id="vehicle-type" required>
                                <option value="two-wheeler">Two wheeler</option>
                                <option value="four-wheeler">Four wheeler</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="brand">Brand</label>
                            <input type="text" name="brand" id="brand" placeholder="e.g. Hyundai" required>
                        </div>
                        <div class="form-group">
                            <label for="name-model">Name / model</label>
                            <input type="text" name="name-model" id="name-model" placeholder="e.g. Creta" required>
                        </div>
                        <div class="form-group">
                            <label for="model-year">Model year</label>
                            <input type="number" name="model-year" id="model-year" placeholder="2020" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>Specifications</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fuel-type">Fuel type</label>
                            <select name="fuel-type" id="fuel-type" required>
                                <option value="petrol">Petrol</option>
                                <option value="diesel">Diesel</option>
                                <option value="cng">CNG</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="transmission-type">Transmission</label>
                            <select name="transmission-type" id="transmission-type" required>
                                <option value="manual">Manual</option>
                                <option value="automatic">Automatic</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="engine-capacity">Engine capacity <span class="unit">cc</span></label>
                            <input type="text" name="engine-capacity" id="engine-capacity" placeholder="1497" required>
                        </div>
                        <div class="form-group">
                            <label for="power">Power <span class="unit">bhp</span></label>
                            <input type="text" name="power" id="power" placeholder="113" required>
                        </div>
                        <div class="form-group">
                            <label for="mileage">Mileage <span class="unit">kmpl</span></label>
                            <input type="number" name="mileage" id="mileage" placeholder="17" required>
                        </div>
                        <div class="form-group">
                            <label for="seats">Seats</label>
                            <input type="number" name="seats" id="seats" placeholder="5" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>Condition &amp; listing</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="kilometers-driven">Kilometers driven <span class="unit">km</span></label>
                            <input type="number" name="kilometers-driven" id="kilometers-driven" placeholder="45000" required>
                        </div>
                        <div class="form-group">
                            <label for="owner-type">Owner type</label>
                            <input type="text" name="owner-type" id="owner-type" placeholder="First / Second" required>
                        </div>
                        <div class="form-group">
                            <label for="color">Color</label>
                            <input type="text" name="color" id="color" placeholder="e.g. White" required>
                        </div>
                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" name="location" id="location" placeholder="City" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>Description</legend>
                    <div class="form-grid">
                        <div class="form-group form-group--full">
                            <label for="description">Anything that affects the value?</label>
                            <textarea name="description" id="description" rows="4"
                                placeholder="Service history, condition, accessories, minor damage..." required></textarea>
                        </div>
                    </div>
                </fieldset>

                <div class="wizard-foot">
                    <button type="button" class="btn btn-secondary" data-prev hidden>Back</button>
                    <span class="wizard-count">Step <b data-current>1</b> of <b data-steps>1</b></span>
                    <button type="button" class="btn" data-next>Continue</button>
                    <button type="submit" class="btn" data-submit hidden>Get my estimate</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='/script/postdata.js') }}"></script>
</body>

</html>
